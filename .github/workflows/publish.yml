name: publish
on:
  release:
    types: [published]
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      COUCHBACKUP_RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
    - name: Download and verify release asset
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download "${COUCHBACKUP_RELEASE_TAG}" \
          --repo ${{ github.repository }} \
          --pattern "cloudant-couchbackup-${COUCHBACKUP_RELEASE_TAG#v}.tgz" \
          --dir .
        gh release verify-asset "${COUCHBACKUP_RELEASE_TAG}" \
          "cloudant-couchbackup-${COUCHBACKUP_RELEASE_TAG#v}.tgz" \
          --repo ${{ github.repository }}
    - name: Setup node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '26'
        registry-url: 'https://registry.npmjs.org'
    - name: Publish to npm
      run: npm publish "cloudant-couchbackup-${COUCHBACKUP_RELEASE_TAG#v}.tgz"
